# w2live relay on Cloudflare (worker.js) + the viewer itself, from one address: ./deploy.sh (it deploys what is
# committed, not the working folder; the game files from its game/ folder); once: npx wrangler secret put TOKEN,
# and for the game files' login GAME_USER and GAME_PASS
name = "w2live"
main = "worker.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "GAMES"
class_name = "LiveGame"

[[durable_objects.bindings]]
name = "INDEX"
class_name = "LiveIndex"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveGame", "LiveIndex"]

[vars]
MIN_DELAY = "0"     # seconds every game is held back at least (the recorder's "delay" adds to it)
KEEP_DAYS = "30"    # a game is deleted this long after it ended

# The viewer (this folder's parent: index.html, replays/, ...) as static files. A path that is a file is served as
# one (free: no Worker request); anything else, i.e. /api/live/..., reaches worker.js. .assetsignore leaves out
# what is not the viewer.
[assets]
directory = ".."
binding = "ASSETS"
run_worker_first = ["/game/*"]   # the game files: only through worker.js's login check
