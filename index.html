<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>War2 Replay Viewer</title>
<link rel="stylesheet" href="viewer.css">
<!-- home-screen app (no browser bars): Android "Install app", iOS Safari "Add to Home Screen" -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#050608">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War2 Replay">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M11 6v12L2.5 12zM21 6v12l-8.5-6z" fill="currentColor"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M13 6v12l8.5-6zM3 6v12l8.5-6z" fill="currentColor"/></symbol>
  <symbol id="i-step" viewBox="0 0 24 24"><path d="M5 5v14l10-7zM16.5 5H19v14h-2.5z" fill="currentColor"/></symbol>
  <symbol id="i-fog" viewBox="0 0 24 24"><path d="M7 18h10.5a4.5 4.5 0 0 0 .6-8.96A6 6 0 0 0 6.5 8.1 5 5 0 0 0 7 18z" fill="currentColor"/></symbol>
  <symbol id="i-follow" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></g><circle cx="12" cy="12" r="2" fill="currentColor"/></symbol>
  <symbol id="i-pview" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></g><rect x="5.5" y="6.5" width="4" height="4" fill="currentColor"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-unfull" viewBox="0 0 24 24"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-score" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="4" width="4" height="4" rx="1"/><rect x="3" y="10" width="4" height="4" rx="1"/><rect x="3" y="16" width="4" height="4" rx="1"/><rect x="9" y="5" width="12" height="2" rx="1"/><rect x="9" y="11" width="12" height="2" rx="1"/><rect x="9" y="17" width="12" height="2" rx="1"/></g></symbol>
  <symbol id="i-seek" viewBox="0 0 24 24"><rect x="2.5" y="13" width="19" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 16.5h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="14" cy="16.5" r="1.8" fill="currentColor"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.9l7.6-3.8M8.2 13.1l7.6 3.8"/></g></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1"/></g></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></g></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="5" width="4" height="15" rx="1"/><rect x="17" y="9" width="4" height="11" rx="1"/></g></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM14 5v14" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</svg>
<main id="stage">
  <div id="viewWrap"><canvas id="view"></canvas><div id="drop" class="drop" hidden>Drop game files here</div><div id="balloons" class="balloons"></div><div id="busy" class="busy" hidden><i class="spin"></i><span></span><b><i></i></b></div><div id="talkers" class="talkers" hidden></div><div id="toast" class="toast" hidden></div></div>
  <div id="cover" class="cover" hidden><button id="coverPlay" class="coverPlay" title="Play"><svg><use href="#i-play"/></svg></button><div id="coverText" class="coverText"></div></div>

  <header id="bar" class="glass">
    <strong class="brand"><span class="logo">W2</span>War2 <em>Replay</em></strong>
    <label class="btn file">Game files…<input id="files" type="file" multiple accept=".exe,.mpq,.w2r,.gz,.pud,.pcap,.pcapng,.cap,.wav,.w2p,.w2c,.json"></label>
    <label id="listBox" class="field" hidden title="Replays and captures in the replays folder next to the viewer (serve.py --replays DIR picks another folder)"><span>Replay</span><select id="replayList"></select></label>
    <label id="rulesBox" class="field" hidden title="Game rules: a capture does not say which War2Combat plugins the players had loaded. Auto tries the original rules and the Peon2k releases (plugin/peon2kvision.w2p or peon2k.w2p of your game folder first, if present) and keeps the one the capture's sync bytes agree with. Score-only and vision-only differences cannot be detected: the game folder's plugin decides, or pick here."><span>Rules</span><select id="rules">
      <option value="auto">auto</option><option value="0">original</option><option value="256">Peon2k 0.2.2</option><option value="512">Peon2k 0.2.3</option>
      <option value="1280">Peon2k 0.2.2.1</option><option value="3328">Peon2k 0.2.2.1 vision</option><option value="1536">Peon2k 0.2.3.1</option><option value="3584">Peon2k 0.2.3.1 vision</option>
    </select></label>
    <label id="peerBox" class="field" hidden title="The player whose view the replay takes (a capture holds every player's packets)"><span>View of</span><select id="peer"></select></label>
    <span id="shareBox" class="shareBox" hidden>
      <button id="share" class="btn shareBtn" title="Copy a link to this replay at this moment: time, view, zoom, watched player, fog, follow, player view and microphones. The link plays from there"><svg><use href="#i-share"/></svg>Share</button>
      <label class="field" title="The shared link plays from its moment and pauses after this many seconds of game time (0: does not pause)">pause after <input id="pauseAfter" type="number" min="0" max="3600" step="1" value="10"> s</label>
    </span>
    <button id="save" class="btn" hidden title="Download the replay converted from the capture (a small .w2r file to share)">Save .w2r</button>
    <span id="status" class="status">Pick <code>Warcraft II BNE.exe</code>, <code>War2Dat.mpq</code> (+ <code>War2Patch.mpq</code>), a <code>.w2r</code> (or <code>.w2r.gz</code>) replay or a <code>.pcapng</code>/<code>.pcap</code> capture of an IPX game and, for custom maps, its <code>.pud</code>. Files stay in this browser.</span>
  </header>

  <div id="score" class="score" hidden></div>

  <aside id="side" class="glass">
    <div class="sideHead">
      <span id="sideTitle" class="sideTitle">Players</span><span id="sideSum" class="sideSum"></span>
    </div>
    <div class="row" id="viewRow">
      <span id="viewOpts" class="viewOpts">
        <label class="field">Fog <select id="fog" title="View as player: keys 1-8; 9 = no fog"><option value="-1">all (no fog)</option></select></label>
      </span>
    </div>
    <div id="inspect" class="inspect" hidden></div>
    <div id="players"></div>
  </aside>

  <div id="miniCard" class="glass"><canvas id="mini" width="192" height="192" title="Click or drag to move the view"></canvas>
    <div id="mapBtns" class="mapBtns">
      <button id="menuBtn" class="iconBtn mapBtn" title="Replays, Share"><svg><use href="#i-menu"/></svg></button>
      <button id="fogBtn" class="iconBtn mapBtn on" hidden aria-pressed="true" title="Show or hide this player's fog of war; the view stays on this player (F)"><svg><use href="#i-fog"/></svg></button>
      <button id="follow" class="iconBtn mapBtn" hidden aria-pressed="false" title="Follow this player's recorded camera (its selection without one); moving the map yourself stops it (L)"><svg><use href="#i-follow"/></svg></button>
      <button id="scoreBtn" class="iconBtn mapBtn on" aria-pressed="true" title="Show / hide the score strip (S)"><svg><use href="#i-score"/></svg></button>
      <button id="seekBtn" class="iconBtn mapBtn" data-mode="auto" title="Timeline: auto (fades while playing) (T)"><svg><use href="#i-seek"/></svg></button>
      <button id="statsBtn" class="iconBtn mapBtn" aria-pressed="false" title="Match stats: units made, kills, economy and army over time, so far (K)"><svg><use href="#i-stats"/></svg></button>
      <button id="miniBtn" class="iconBtn mapBtn on" aria-pressed="true" title="Show / hide the minimap"><svg><use href="#i-map"/></svg></button>
      <button id="sideOpen" class="iconBtn mapBtn on" aria-pressed="true" title="Show / hide the players panel (Y)"><svg><use href="#i-panel"/></svg></button>
      <label class="iconBtn mapBtn pvBtn" title="Player view: the replay as the fog-of-war player saw it: its fog, selection, camera, sounds and the game's own screen (P)"><input id="pview" type="checkbox"><svg><use href="#i-pview"/></svg></label>
    </div></div>

  <div id="statsWin" class="statsWin glass" hidden role="dialog" aria-label="Match stats">
    <div class="statsTop">
      <div class="statsTabs" role="tablist">
        <button data-tab="units" role="tab" title="Units and buildings made so far, with how many are alive now (the top number) over how many were made (the bottom one; finished buildings, an upgraded hall counts again as its new type), the upgrades and spells researched, and the economy and army charts. Point at an icon to mark on the charts when those were made and lost">Units</button>
        <button data-tab="kills" role="tab" title="What was killed so far, a row per victims' player, friendly kills marked, with the cost of what was killed and of what was lost, and a chart of the value killed. Point at an icon to mark on the chart when those were killed">Kills</button>
        <button data-tab="dmg" role="tab" title="Damage: the hp dealt to other teams so far, by unit type (its weapon) and by spell, with its share, the kills (blows that took all a unit had) and what hit their own side; and how their runes ended: set off by an enemy or by their own, by a unit with unholy armour, timed out or still lying">Damage</button>
        <button data-tab="voice" role="tab" hidden title="Voice intensity (opt-in): how worked up each player sounds compared with their own normal in this game (pitch and loudness against their own average) and how much they talk, from their CamRec microphone. Not a stress or lie detector">Voice</button>
        <button data-tab="kurc" role="tab" title="Kurčometar: how big each player acts, in cm (a joke: ego, not anatomy), from their EPM (game commands a minute), their combat army and the value they killed, minus how much and how worked up they whined, each against the other players in this game">Kurčometar</button>
      </div>
      <span id="statsLegend" class="statsLegend"></span>
      <span id="statsTime" class="statsTime"></span>
      <button id="statsX" class="iconBtn statsX" title="Close (Esc, K)">×</button>
    </div>
    <div id="statsBody" class="statsBody"></div>
    <div id="statsTip" class="statsTip" hidden></div>
  </div>

  <div id="vuPanel" class="vuPanel glass" hidden></div>

  <div id="controls" class="controls glass" hidden>
    <div class="timeline">
      <canvas id="voiceWave" class="voiceWave" hidden title="The watched player's voice: how loud (height) and how worked up compared with their own normal (colour: blue calmer, grey normal, orange to red worked up). A click goes there. The analysis can be switched off on the stats window's Voice tab (K)"></canvas>
      <input id="seek" type="range" min="0" max="1" value="0" step="1" aria-label="Seek">
      <output id="seekTip" class="seekTip" hidden></output>
    </div>
    <div class="ctlRow">
      <div class="transport">
        <button id="back60" class="iconBtn txt" title="Back 1 min (Shift+←)">−1m</button>
        <button id="back10" class="iconBtn" title="Back 10 s (←)"><svg><use href="#i-back"/></svg></button>
        <button id="play" class="iconBtn big" title="Play / pause (space)"><svg><use href="#i-play"/></svg></button>
        <button id="fwd10" class="iconBtn" title="Forward 10 s (→)"><svg><use href="#i-fwd"/></svg></button>
        <button id="fwd60" class="iconBtn txt" title="Forward 1 min (Shift+→)">+1m</button>
        <button id="step" class="iconBtn" title="Step one turn (.)"><svg><use href="#i-step"/></svg></button>
        <select id="speed" class="speed" title="Playback speed">
          <option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="0">max</option>
        </select>
      </div>
      <button id="liveBtn" class="liveBtn" hidden title="A live game: the latest moment that has arrived. Click to go there">LIVE</button>
      <span id="clock" class="clock" role="button" tabindex="0" title="Go to a time: click and type it (G)">0:00</span>
      <input id="timeIn" class="timeIn" hidden autocomplete="off" spellcheck="false" inputmode="text" placeholder="m:ss" title="Game time to go to: h:mm:ss, m:ss, or minutes. Enter goes, Esc cancels">
      <span class="viewTogs">
        <label class="chk" title="HP bars (H)"><input id="hp" type="checkbox" autocomplete="off"> HP bars</label>
        <label id="camBox" class="chk" hidden title="Recorded viewports and mouse cursors of the players who ran the CamRec plugin (C). In the player view the camera then follows that player's own screen."><input id="camShow" type="checkbox" checked> Cameras</label>
        <label id="inputBox" class="chk" hidden title="Player view: the recorded mouse buttons, drag box and keys of that player (I): clicks, the box being dragged, the pressed command button, the keys pressed and actions per minute. Needs a recording by the current CamRec plugin."><input id="inputShow" type="checkbox" checked> Input</label>
        <label id="waveBox" class="chk" hidden title="The watched player's voice above the timeline: loudness and how worked up they sounded"><input id="waveShow" type="checkbox" checked> Voice</label>
        <label id="vuBox" class="chk" hidden title="Kmečometar: how worked up the watched player (or each team) sounds right now, from −2 R to +2 R (R: Rubelj; 0 = their own normal), the peak held 1.5 s"><input id="vuShow" type="checkbox"> Kmečometar</label>
      </span>
      <span id="pvSlot" class="pvSlot"></span>
      <span class="audio">
        <label title="Volume. Sound starts with your first click or key press"><span class="lbl">vol</span> <input id="volume" type="range" min="0" max="100" value="70"></label>
        <label title="Unit voices: selection / acknowledge (and, in the player view, its notices). The checkbox: in the free view, also the selection / acknowledge voices of the Fog-of-war player's clicks (of the recording machine's player with fog &quot;all&quot;); the player view always plays them."><input id="voices" type="checkbox"> <span class="lbl">voices</span> <input id="voiceVol" type="range" min="0" max="100" value="100" title="Voice volume"></label>
        <label title="Sound effects: combat, buildings, spells..."><span class="lbl">fx</span> <input id="fxVol" type="range" min="0" max="100" value="100"></label>
        <span id="micsBox" hidden><label title="The players' microphones (CamRec plugin), at 1x speed. Pick whom to listen to with the mic buttons in the players list."><input id="mics" type="checkbox"> <span class="lbl">mics</span> <input id="micVol" type="range" min="0" max="400" value="100" title="Microphone volume"></label>
          <label title="Listen only to the player picked in Fog of war (keys 1-8); with fog &quot;all&quot;, to the mics picked in the players list"><input id="micLink" type="checkbox" checked> <span class="lbl">follows view</span></label></span>
      </span>
      <button id="setBtn" class="iconBtn" title="Sound and view settings"><svg><use href="#i-gear"/></svg></button>
      <button id="fullBtn" class="iconBtn" hidden title="Full screen (X)"><svg><use href="#i-full"/></svg></button>
    </div>
  </div>
</main>
<script type="module" src="viewer.js"></script>
</body>
</html>
